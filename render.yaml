services:
  - type: web
    name: khmer-translator-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: standard
    healthCheckPath: /api/ready
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CORS_ORIGINS
        value: "https://khmer-ai-16c.pages.dev,https://f50e2d76.khmer-ai-16c.pages.dev,http://localhost:5173"
      - key: WHISPER_DEVICE
        value: "cpu"
      - key: WHISPER_COMPUTE_TYPE
        value: "int8"
      - key: DATABASE_URL
        fromDatabase:
          name: khmer-translator-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: khmer-translator-db
    plan: free
    databaseName: khmer_translator
    user: khmer_admin
