name: Khmer Translator CI Pipeline

on:
  push:
    branches: [main, master, feature/self-healing-system]
  pull_request:
    branches: [main, master, feature/self-healing-system]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Verify FFmpeg
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        run: |
          cd backend
          pytest tests/ -v

  frontend-build:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript & Vite Build
        run: |
          cd frontend
          npm run build

  self-healing-tests:
    name: Self-Healing Architecture Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock

      - name: Verify Python Syntax & Imports
        run: |
          python -m py_compile self_healing/*.py self_healing/**/*.py

      - name: Run Self-Healing Test Suite
        run: |
          pytest self_healing/tests/ -v
